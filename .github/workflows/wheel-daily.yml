name: wheel-daily
on:
  schedule:
    - cron: "45 14 * * 1-5"   # 10:45 ET — post-open, settled prices
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: wheel-daily
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: run wheel
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          IS_PAPER: "true"
          # The shared earnings sheet, read over the trade-refresh worker's
          # token-gated /marketdata-earnings route. Read-only by construction:
          # this repo holds no R2 credential (same posture as ai-hedge-fund).
          TR_WORKER_URL: ${{ secrets.TR_WORKER_URL }}
          TR_WORKER_TOKEN: ${{ secrets.TR_WORKER_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
        run: python scripts/run_daily.py
      - name: commit state
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Same guard as ai-hedge-fund's bridge-daily: state belongs on the
          # default branch, where the opener rail reads it. A run re-dispatched
          # from another branch fails here instead of writing an invisible row.
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "refusing to write state on '$GITHUB_REF_NAME' —" \
                 "it belongs on '$DEFAULT_BRANCH'. Re-dispatch there."
            exit 1
          fi
          git config user.name "wheel-bot" && git config user.email "wheel@local"
          git add state/ logs/ || true
          git diff --cached --quiet || git commit -m "state: $(date -u +%F)" && git push || true
